services:
  postgres:
    image: postgres:16-alpine
    container_name: contas-postgres
    environment:
      POSTGRES_DB: contas
      POSTGRES_USER: contas
      POSTGRES_PASSWORD: contas
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contas -d contas"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
