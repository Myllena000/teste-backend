spring.application.name=contas

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/contas}
spring.datasource.username=${DB_USER:contas}
spring.datasource.password=${DB_PASSWORD:contas}
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '5s'

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Jackson
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.serialization.write-dates-as-timestamps=false

# Server
server.error.include-stacktrace=never

# Actuator Management
management.endpoints.web.exposure.include=health, info, metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Info
info.app.nome=contas
info.app.descricao=Sistema de contas e transferências

# Springdoc / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Custom App Properties
app.agendamento.job.habilitado=true
app.agendamento.job.intervalo-ms=10000
app.agendamento.job.lote=50
app.agendamento.job.max-tentativas=3